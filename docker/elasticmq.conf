include classpath("application.conf")

// Local SQS emulator for `npm run dev` + a locally-run worker/index.js.
// Never used in production — the EC2 worker keeps polling the real AWS
// queue via .env; this only takes effect through .env.local overrides.
queues {
  document-ingestion-queue {
    defaultVisibilityTimeout = 600 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
  }
  // Chat image jobs (SQS_CHAT_QUEUE_URL) — polled by the worker's second loop.
  chat-image-queue {
    defaultVisibilityTimeout = 600 seconds
    delay = 0 seconds
    receiveMessageWait = 20 seconds
  }
}
